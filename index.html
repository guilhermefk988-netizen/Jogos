<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="Jogos.css">
</head>

<body>
    <header class="header">
        <div class="Super__header">


            <div>
                <h1>GameStor</h1>
            </div>

            <nav class="nav">
                <a href="#">Inicio</a>
                <a href="#">Explorar</a>
                <a href="#">Gêneros</a>
                <a href="#">Plataformas</a>
                <a href="#">Favoritos</a>
            </nav>

            <div class="Input__header">
                <input  class="input" placeholder="Buscar..." type="text">
                <img class="Imagem" width="30" height="30" src="https://img.icons8.com/ios/50/ffffff/search--v1.png"
                    alt="search--v1" />
            </div>
        </div>
    </header>

    <section class="mains">
        <div class="principais__jogos">
            <img src="imgs/goku.png" alt="">
            <div class="Conteudo__principal">

            </div>
        </div>
    </section>

    <div class="MINI__titulo__genero">
        <div class="Titulo__genero">
            <h2>Explorar por gênero</h2>
        </div>
    </div>

    <section class="Escolha__genero">


        <div class="cards Ação" data-genero="Action">
            <p>Ação</p>
        </div>
        <div class="cards" data-genero="RPG">
            <p>Aventura</p>
        </div>
        <div class="cards" data-genero="RPG">
            <p>RPG</p>
        </div>
        <div class="cards" data-genero="Strategy">
            <p>Estratégia</p>
        </div>
        <div class="cards" data-genero="Sports">
            <p>Esportes</p>
        </div>
        <div class="cards" data-genero="Racing">
            <p>Corrida</p>
        </div>
        <div class="cards" data-genero="Fighting">
            <p>Luta</p>
        </div>
        <div class="cards" data-genero="Shooter">
            <p>Tiro</p>
        </div>
        <div class="cardzinho">
            <p>Ver todos</p>

        </div>


    </section>
    <div class="Jogo__nome">
        <div class="jogos__Sem__sessao">


            <h2> jogos</h2>
        </div>
    </div>
    <section class="Todos__jogos">
        <div class="cards__jogos"></div>
    </section>


</body>
<script src="Jogos.js"></script>

</html>
